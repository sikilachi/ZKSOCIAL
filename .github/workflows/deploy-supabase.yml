
name: Deploy ZKSocial Supabase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Check credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$PROJECT_REF"
          echo "Project reference length: ${#PROJECT_REF}"
          supabase projects list

      - name: Deploy create-order
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-order --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy order-action
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy order-action --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy telegram-bot
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy telegram-bot --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy paypal-capture-order
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy paypal-capture-order --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy paypal-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy paypal-webhook --no-verify-jwt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
